name: Build Fisker Warm 0.3.2 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK Platform 35 and Build Tools 35.0.0
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run offline safety tests
        run: python3 scripts/test_core.py
      - name: Build signed APK
        run: python3 scripts/build_android.py
      - name: Verify APK signature, permissions, and manifest
        run: python3 scripts/verify_apk.py --build-tools "$ANDROID_SDK_ROOT/build-tools/35.0.0"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Fisker-Warm-Lab-0.3.2-APK
          path: dist/Fisker-Warm-Lab-0.3.2.apk
          if-no-files-found: error
          retention-days: 30
