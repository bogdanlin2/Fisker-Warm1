name: Stage 6 relay regression tests (no APK)
on:
  push:
    branches: [stage6/internet-gateway-test]
    paths: ['internet/relay/**', 'scripts/test_deployed_relay.py', '.github/workflows/stage6-relay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 scripts/test_internet.py
