name: Build Fisker Warm APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test core
        run: python3 scripts/test_core.py
      - name: Build signed APK
        run: python3 scripts/build_android.py
      - name: Verify APK
        run: python3 scripts/verify_apk.py --build-tools "$ANDROID_HOME/build-tools/35.0.0"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fisker-Warm-Lab-APK
          path: dist/*.apk
          if-no-files-found: error
